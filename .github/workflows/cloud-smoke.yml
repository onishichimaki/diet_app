name: Production cloud smoke test

on:
  push:
    branches: [work]
  workflow_dispatch:

permissions:
  statuses: write

jobs:
  verify-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        run: sleep 90
      - name: Verify Supabase configuration through production
        id: cloud
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --retry 5 --retry-delay 15 --max-time 30 https://diet-app-chimaki.vercel.app/api/cloud-diagnostics)"
          echo "$response"
          description="$(echo "$response" | jq -r '"ok=\(.ok) upstream=\(.upstreamStatus // 0) key=\(.keySource)/\(.keyFormat // "none") len=\(.keyLength // 0)"' | cut -c1-140)"
          state="$(echo "$response" | jq -r 'if .ok == true and .upstreamStatus == 200 then "success" else "failure" end')"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${{ github.token }}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$(jq -n --arg state "$state" --arg description "$description" --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{state:$state,context:"cloud-smoke/details",description:$description,target_url:$target_url}')"
          test "$state" = success
